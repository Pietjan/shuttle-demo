version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - wastedassign

  exclusions:
    rules:
      # Generated by templ. Nothing here is hand-written, so a finding is
      # about the generator rather than about this repository.
      - path: _templ\.go
        linters:
          - errcheck
          - gocritic
          - revive
          - staticcheck

formatters:
  enable:
    - gofumpt
